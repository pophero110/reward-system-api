{{/* quest_card.html */}}
<div id="quest-{{.ID}}" class="quest-card" role="article" aria-labelledby="quest-{{.ID}}-title" tabindex="0">

  <header class="quest-header">
    <div class="quest-left">
      <h3 id="quest-{{.ID}}-title" class="quest-title">
        {{.ID}} — {{.Title}}
      </h3>
      {{if .DueDateTime}}
      <time class="quest-due" datetime="{{.DueDateTime.Format " 2006-01-02T15:04:05Z07:00"}}">
        Due: {{.DueDateTime.Format "Jan 2, 2006 3:04 PM"}}
      </time>
      {{end}}
    </div>

    <div class="quest-right">
      <span class="quest-status quest-status-{{.Status}}">{{.Status}}</span>
      <span class="quest-reward">🏆 {{.Reward}}</span>
    </div>
  </header>

  <p class="quest-desc">{{.Description}}</p>

  <nav class="quest-actions" aria-label="Quest actions for quest {{.ID}}">
    <button class="btn btn-complete" hx-post="/quests/{{.ID}}/complete" hx-target="#quest-{{.ID}}" hx-swap="outerHTML"
      title="Mark quest complete">
      ✓ Complete
    </button>

    <button class="btn btn-edit" hx-get="/quests/{{.ID}}/edit" hx-target="#quest-{{.ID}}" hx-swap="outerHTML"
      title="Edit quest">
      ✎ Edit
    </button>

    <button class="btn btn-delete" hx-delete="/quests/{{.ID}}" hx-target="#quest-{{.ID}}" hx-swap="outerHTML"
      title="Delete quest">
      🗑 Delete
    </button>
  </nav>
</div>

<style>
  .quest-card {
    width: 300px;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 1rem;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 0.5rem;
    ackground-color: #fff;
  }

  .quest-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .quest-title {
    margin: 0;
    font-size: 1.1rem;
  }

  .quest-due {
    font-size: 0.85rem;
    color: #555;
  }

  .quest-status {
    font-weight: bold;
    text-transform: capitalize;
  }

  .quest-reward {
    margin-left: 0.5rem;
  }

  .quest-desc {
    font-size: 0.95rem;
    margin: 0.5rem 0;
  }

  .quest-actions {
    display: flex;
    gap: 0.5rem;
  }

  .btn {
    padding: 0.25rem 0.5rem;
    border: none;
    cursor: pointer;
    border-radius: 4px;
  }

  .btn-complete {
    background-color: #38c172;
    color: white;
  }

  .btn-edit {
    background-color: #3490dc;
    color: white;
  }

  .btn-delete {
    background-color: #e3342f;
    color: white;
  }
</style>
